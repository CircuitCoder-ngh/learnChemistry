<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary | The Mole Hole</title>
<meta name="description" content="Every chemistry term from the whole course, in plain words, with a link back to the lesson that teaches it.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/lesson-glossary.css">
<script>try{var t=JSON.parse(localStorage.getItem('mh:theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
<script defer src="assets/js/data/elements.js"></script>
<script defer src="assets/js/lab.js"></script>
<script defer src="assets/js/moe.js"></script>
<script defer src="assets/js/art.js"></script>
<script defer src="assets/js/bank.js"></script>
<script defer src="assets/js/pages/glossary.js"></script>
</head>
<body data-page="glossary">
<header id="site-header"></header>
<div class="layout">
<aside id="rail" class="rail"></aside>
<main id="main" class="lesson">

  <header class="lesson-head">
    <div class="lesson-head-inner">
      <div>
        <h1>Glossary</h1>
        <p class="lede">Every term in the course, in plain words. Each one links back to the lesson that teaches it.</p>
      </div>
      <div class="lesson-moe" data-moe="think"></div>
    </div>
  </header>

  <div class="gl-tools" id="gl-tools">
    <div class="gl-searchrow">
      <label class="sr-only" for="gl-search">Search the glossary</label>
      <input id="gl-search" class="gl-search" type="search" placeholder="Search for a term, like molar mass" autocomplete="off" spellcheck="false">
      <p class="gl-count" id="gl-count" aria-live="polite"></p>
    </div>
    <nav class="gl-index" id="gl-index" aria-label="Jump to a letter" data-overflow-ok></nav>
  </div>

  <div class="gl-list" id="gl-list"></div>
  <div class="gl-empty" id="gl-empty" hidden>
    <div class="moe-says"><div class="moe-pic" data-moe="oops"></div><div class="bubble"><p id="gl-empty-text"></p></div></div>
  </div>

</main>
</div>
<footer id="site-footer"></footer>
</body>
</html>
